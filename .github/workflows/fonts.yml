name: Build font index
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/test_desktop_catalog.py'
      - '.github/workflows/fonts.yml'
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: font-index-main-v2
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install font parsing dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache/desktop-fonts-v1
          key: desktop-fonts-v1-${{ github.run_id }}
          restore-keys: desktop-fonts-v1-
      - name: Validate desktop catalog rules
        run: python -m unittest discover -s tests -p 'test_desktop_catalog.py'
      - name: Sort fonts and build index
        run: python scripts/build_index.py
      - name: Index verified Google Fonts TTF and OTF files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/google_fonts_catalog.py
      - name: Index verified Fontsource original TTF and OTF files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/fontsource_catalog.py
      - name: Exclude fonts unavailable for desktop design software
        run: python scripts/filter_usable_fonts.py
      - name: Check catalog size and formats
        run: |
          python -c "import json,pathlib; p=pathlib.Path('dist/fonts.json'); a=json.loads(p.read_text()); assert a and p.stat().st_size<24*1024*1024; assert all(x['format'] in ('ttf','otf') for x in a)"
      - name: Commit updated data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fonts dist incoming licenses
          if git diff --cached --quiet; then
            echo "Index is already up to date"
            exit 0
          fi
          git commit -m "chore: organize fonts and refresh index"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Rebase conflict; refusing to overwrite repository changes"
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::Push failed after 5 attempts"
          exit 1

