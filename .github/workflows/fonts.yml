name: Build font index
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fonts.yml'
      - 'scripts/**'
      - 'requirements.txt'
      - 'metadata/**'
      - 'fonts/**'
      - 'incoming/**'
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: font-index-main-v2
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install font parsing dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Sort fonts and build index
        run: python scripts/build_index.py
      - name: Merge Google Fonts metadata into the same index
        run: python scripts/google_fonts_catalog.py
      - name: Merge Fontsource metadata without cloning or downloading font files
        run: python scripts/fontsource_catalog.py
      - name: Exclude fonts unavailable for desktop design software
        run: python scripts/filter_usable_fonts.py
      - name: Commit updated data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fonts dist incoming licenses
          if git diff --cached --quiet; then
            echo "Index is already up to date"
            exit 0
          fi
          git commit -m "chore: organize fonts and refresh index"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Rebase conflict; refusing to overwrite repository changes"
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::Push failed after 5 attempts"
          exit 1
