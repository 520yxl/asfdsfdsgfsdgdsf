name: Build font index
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fonts.yml'
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: font-repository-writes
  cancel-in-progress: false
jobs:
  index:
    if: github.event_name != 'push' || github.event.head_commit.message == 'ci: one-time rebuild after index fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Sort fonts and build index
        run: python scripts/build_index.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add incoming fonts dist licenses
          if ! git diff --cached --quiet; then
            git commit -m "chore: organize fonts and refresh index"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Rebase conflict: refusing to overwrite remote changes"
                exit 1
              fi
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            echo "Push failed after 5 attempts"
            exit 1
          fi
