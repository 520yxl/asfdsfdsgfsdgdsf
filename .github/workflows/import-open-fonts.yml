name: Import curated open Chinese fonts every 10 minutes
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: font-repository-writes
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Fetch curated list and import one licensed font
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/import_curated_fonts.py
          git add incoming fonts dist licenses metadata/import-progress.json
          if git diff --cached --quiet; then
            echo "No eligible new fonts to import"
            exit 0
          fi
          git commit -m "chore: import one curated open font and refresh index"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Unable to safely rebase font import"
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Imported font and index committed successfully"
              exit 0
            fi
            sleep 3
          done
          exit 1
