name: Bulk import curated licensed fonts to incoming
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bulk-import-incoming.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fonttools
      - name: Import verified redistributable fonts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_NEW_FONTS: '25'
        run: python scripts/bulk_import_curated.py
      - name: Commit downloaded files and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add incoming/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: bulk import licensed curated fonts to incoming"
          git pull --rebase origin main
          git push origin HEAD:main
